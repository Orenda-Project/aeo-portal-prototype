<title>Rumi Portal — AEO View (Prototype)</title>
<style>
  :root{
    --primary:#0E1F4C;
    --primary-light:#2440A0;
    --accent:#E86835;
    --bg:#FFFFFF;
    --fg:#1D1F24;
    --muted:#F3F4F5;
    --muted-fg:#6B7280;
    --border:#E2E4E8;
    --success:#22C55E;
    --warning:#F59E0B;
    --error:#DC2626;
    --shadow-soft:0 4px 24px -4px rgba(29,31,36,0.06);
    --shadow-medium:0 12px 48px -8px rgba(29,31,36,0.10);
    --canvas:#FAFAFB;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background: color-mix(in srgb, var(--accent) 30%, transparent); }
  a{ color: inherit; }
  button{ font-family:inherit; }

  .app{ display:flex; flex-direction:column; min-height:100vh; }

  /* ---------- top nav ---------- */
  .navbar{
    height:64px; flex:0 0 64px;
    background:var(--primary);
    color:#fff;
    display:flex; align-items:center;
    padding:0 24px;
    gap:20px;
    position:sticky; top:0; z-index:20;
  }
  .navbar .brand{ display:flex; align-items:center; gap:10px; margin-right:8px; }
  .navbar .brand .mark{
    width:28px;height:28px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 28px;
  }
  .navbar .brand .mark svg{ width:18px;height:18px; }
  .navbar .brand span{ font-weight:600; font-size:16px; letter-spacing:.1px; }

  .navlinks{ display:flex; align-items:center; gap:2px; }
  .navlinks button{
    appearance:none; border:0; cursor:pointer;
    background:transparent; color:rgba(255,255,255,.7);
    padding:8px 16px; border-radius:8px; font-size:14px; font-weight:500;
    display:flex; align-items:center; gap:8px;
    transition:background .15s ease,color .15s ease;
  }
  .navlinks button:hover{ background:rgba(255,255,255,.1); color:#fff; }
  .navlinks button.active{ background:rgba(255,255,255,.2); color:#fff; }
  .navlinks button .badge-count{
    background:var(--accent); color:#fff; font-size:10px; font-weight:700;
    padding:1px 6px; border-radius:999px; line-height:1.4;
  }

  .navbar .spacer{ flex:1; }

  .visibility-toggle{
    display:flex; align-items:center; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:2px;
    gap:2px;
  }
  .visibility-toggle button{
    appearance:none; border:0; cursor:pointer; background:transparent;
    color:rgba(255,255,255,.65); font-size:12px; font-weight:600;
    padding:5px 12px; border-radius:999px; transition:all .15s ease;
  }
  .visibility-toggle button.active{ background:#fff; color:var(--primary); }
  .visibility-toggle button:focus-visible{ outline:2px solid #fff; outline-offset:1px; }

  .role-toggle{
    display:flex; align-items:center; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:2px;
    gap:2px;
  }
  .role-toggle button{
    appearance:none; border:0; cursor:pointer; background:transparent;
    color:rgba(255,255,255,.65); font-size:12px; font-weight:600;
    padding:5px 12px; border-radius:999px; transition:all .15s ease;
  }
  .role-toggle button.active{ background:var(--accent); color:#fff; }
  .role-toggle button:focus-visible{ outline:2px solid #fff; outline-offset:1px; }

  .navbar .role-pill{
    font-size:12px; font-weight:600; color:#fff;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2);
    padding:4px 10px; border-radius:999px;
    letter-spacing:.3px; white-space:nowrap;
  }
  .navbar .user{
    display:flex; align-items:center; gap:10px;
    padding-left:16px; margin-left:4px;
    border-left:1px solid rgba(255,255,255,.18);
  }
  .navbar .user .name{ font-size:13px; color:rgba(255,255,255,.85); font-weight:500; }
  .navbar .user .role{ font-size:11px; color:rgba(255,255,255,.55); }
  .navbar .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; flex:0 0 30px;
  }
  .navbar .logout{
    background:transparent;border:0;color:rgba(255,255,255,.55);
    cursor:pointer; font-size:13px; padding:6px 8px; border-radius:6px;
  }
  .navbar .logout:hover{ color:#fff; background:rgba(255,255,255,.08); }
  .navbar button:focus-visible, .navbar .logout:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  .logout-icon{ display:none; font-size:16px; }

  /* ---------- bottom tab bar (mobile only) ---------- */
  .bottom-nav{
    display:none;
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--primary); border-top:1px solid rgba(255,255,255,.12);
    box-shadow:0 -4px 16px -4px rgba(0,0,0,.2);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .bottom-nav .bn-row{ display:flex; }
  .bottom-nav button{
    flex:1; appearance:none; border:0; cursor:pointer; background:transparent;
    color:rgba(255,255,255,.65); padding:8px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; font-weight:600; position:relative;
  }
  .bottom-nav button.active{ color:#fff; }
  .bottom-nav .bn-icon{ font-size:19px; line-height:1; }
  .bottom-nav .badge-count{
    position:absolute; top:2px; right:calc(50% - 20px);
    background:var(--accent); color:#fff; font-size:9px; font-weight:700;
    padding:1px 5px; border-radius:999px; line-height:1.4;
  }

  /* ---------- breadcrumb / shell ---------- */
  .shell{ flex:1; width:100%; }
  .container{ max-width:1180px; margin:0 auto; padding:32px 32px 64px; }

  .crumbs{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--muted-fg); margin-bottom:20px;
  }
  .crumbs button{
    background:none;border:0;cursor:pointer;color:var(--muted-fg);
    font-size:13px; padding:2px 4px; border-radius:4px;
  }
  .crumbs button:hover{ color:var(--primary); text-decoration:underline; }
  .crumbs .current{ color:var(--fg); font-weight:600; }
  .crumbs .sep{ opacity:.5; }

  .page-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:24px; margin-bottom:24px; flex-wrap:wrap;
  }
  .page-head h1{
    font-size:30px; font-weight:300; margin:0 0 6px; letter-spacing:-.2px;
  }
  .page-head p{ margin:0; color:var(--muted-fg); font-size:14px; max-width:64ch; }
  .page-head .actions{ display:flex; gap:10px; }

  .btn{
    appearance:none; cursor:pointer; border-radius:8px; font-size:13.5px; font-weight:600;
    padding:9px 16px; border:1px solid transparent; display:inline-flex; align-items:center; gap:8px;
    transition:filter .15s ease, background .15s ease;
  }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.12); }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--fg); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--muted); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; }
  .btn:focus-visible{ outline:2px solid var(--primary-light); outline-offset:2px; }

  /* ---------- context chips (context-before-numbers) ---------- */
  .context-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .context-chip{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--muted-fg); background:var(--muted);
    border:1px solid var(--border); border-radius:8px; padding:6px 12px;
  }
  .context-chip b{ color:var(--fg); font-weight:600; }
  .context-chip.warn{ color:#9a6400; background:color-mix(in srgb, var(--warning) 12%, var(--muted)); border-color:color-mix(in srgb, var(--warning) 30%, var(--border)); }

  /* ---------- stat cards ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:32px;
  }
  .stats.k4{ grid-template-columns:repeat(4,1fr); gap:12px; }
  .stats.k4 .stat-card{ padding:14px 16px; }
  .stats.k4 .value{ font-size:24px; }
  .stats.k4 .label{ margin-bottom:6px; }
  @media (max-width:900px){ .stats{ grid-template-columns:repeat(2,1fr);} .stats.k4{ grid-template-columns:repeat(2,1fr); gap:12px;} }
  @media (max-width:560px){ .stats.k4 .stat-card{ padding:16px;} .stats.k4 .value{ font-size:24px;} .stats .stat-card{ padding:16px;} }
  .stat-card{
    background:var(--bg); border:1px solid var(--border); border-radius:12px;
    padding:20px; box-shadow:var(--shadow-soft);
    border-left:3px solid var(--border);
  }
  .stat-card.accent-primary{ border-left-color:var(--primary); }
  .stat-card.accent-warning{ border-left-color:var(--warning); }
  .stat-card .label{
    font-size:12px; color:var(--muted-fg); font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    margin-bottom:10px;
  }
  .stat-card .value{ font-size:30px; font-weight:300; font-variant-numeric:tabular-nums; line-height:1; }
  .stat-card .value.tile-metric-row{ display:flex; align-items:center; gap:8px; }
  .stat-card .sub{ font-size:12px; color:var(--muted-fg); margin-top:8px; }

  /* ---------- sections / cards ---------- */
  .section{ margin-bottom:36px; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;
  }
  .section-head h2{ font-size:20px; font-weight:600; margin:0; }
  .section-head .hint{ font-size:13px; color:var(--muted-fg); }
  .section-link{ color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .section-link:hover{ text-decoration:underline; }

  .card{
    background:var(--bg); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow-soft); overflow:hidden;
  }

  /* ---------- attention cards ---------- */
  .attn-card{
    display:flex; gap:14px; align-items:flex-start; padding:18px 20px;
    border-bottom:1px solid var(--border);
  }
  .attn-card:last-child{ border-bottom:0; }
  .attn-card .icon{
    position:relative;
    width:34px;height:34px;border-radius:10px; flex:0 0 34px;
    display:flex;align-items:center;justify-content:center; font-size:15px;
  }
  .attn-card .icon.sev-high{ background:color-mix(in srgb, var(--error) 15%, transparent); color:var(--error); }
  .attn-card .icon.sev-medium{ background:color-mix(in srgb, var(--warning) 16%, transparent); color:var(--warning); }
  .attn-card .icon.sev-low{ background:var(--muted); color:var(--muted-fg); }
  .attn-card .body{ flex:1; }
  .attn-card .title{ font-size:14.5px; font-weight:600; margin-bottom:3px; }
  .attn-card .desc{ font-size:13px; color:var(--muted-fg); line-height:1.5; }
  .attn-empty{ padding:40px 20px; text-align:center; color:var(--muted-fg); font-size:14px; }
  .attn-empty .big{ font-size:28px; margin-bottom:8px; }

  /* ---------- table (roster) ---------- */
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.roster{ width:100%; border-collapse:collapse; font-size:14px; min-width:520px; }
  table.roster thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted-fg); font-weight:600; padding:12px 20px; background:var(--muted);
    border-bottom:1px solid var(--border);
  }
  table.roster tbody tr{ cursor:pointer; transition:background .12s ease; border-bottom:1px solid var(--border); }
  table.roster tbody tr:last-child{ border-bottom:0; }
  table.roster tbody tr:hover{ background:var(--muted); }
  table.roster tbody tr.static{ cursor:default; }
  table.roster tbody tr.static:hover{ background:transparent; }
  table.roster td{ padding:14px 20px; vertical-align:middle; }
  table.roster td.num{ font-variant-numeric:tabular-nums; }
  .row-name{ font-weight:600; }
  .row-sub{ font-size:12px; color:var(--muted-fg); margin-top:2px; }
  .chevron{ color:var(--muted-fg); float:right; }

  .trend{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; margin-left:8px; }
  .trend.up{ color:var(--success); }
  .trend.down{ color:var(--error); }
  .trend.flat{ color:var(--muted-fg); }

  /* ---------- school cards ---------- */
  .school-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; margin-bottom:20px;
  }
  @media (max-width:640px){ .school-grid{ grid-template-columns:1fr; gap:12px; } }
  .school-card{
    background:var(--bg); border:1px solid var(--border); border-radius:12px;
    padding:20px; box-shadow:var(--shadow-soft); cursor:pointer;
    transition:box-shadow .15s ease; display:flex; flex-direction:column; gap:14px;
  }
  .school-card:hover{ box-shadow:var(--shadow-medium); }
  .sc-name{ font-weight:600; font-size:15px; }
  .sc-meta{ font-size:12px; color:var(--muted-fg); margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .conn-badge{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:color-mix(in srgb, var(--success) 14%, transparent); color:#1a7f42;
  }
  .conn-badge.warn{ background:color-mix(in srgb, var(--warning) 16%, transparent); color:#9a6400; }
  .conn-badge.bad{ background:color-mix(in srgb, var(--error) 14%, transparent); color:var(--error); }

  .sc-primary-top{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .sc-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--muted-fg); }
  .sc-metric-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .sc-value{ font-size:20px; font-weight:300; font-variant-numeric:tabular-nums; }

  .sc-secondary{
    display:flex; flex-direction:column; gap:8px;
    padding-top:12px; border-top:1px solid var(--border); font-size:12.5px;
  }
  .sc-secondary .sc-label{ margin:0; }
  .sc-secondary-val{ font-size:20px; font-weight:300; font-variant-numeric:tabular-nums; color:var(--fg); }

  .sc-foot{ display:flex; align-items:center; justify-content:space-between; }
  .teacher-badge{
    font-size:12px; font-weight:600; color:var(--primary);
    background:color-mix(in srgb, var(--primary) 8%, transparent);
    padding:3px 10px; border-radius:999px;
  }

  .needs-support{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:var(--warning);
  }
  .needs-support::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--warning); flex:0 0 6px;
  }
  .no-flag{ color:var(--muted-fg); font-size:13px; }
  .masked{ color:var(--muted-fg); font-style:italic; }

  /* on the roster but never registered — a neutral state, not a performance flag */
  .not-on-rumi{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:var(--muted-fg);
    background:var(--muted); padding:3px 9px; border-radius:999px;
  }

  /* Status-led roster card — replaces a horizontal-scrolling table for lists
     that are really "one entity + one status", so it reads fine on mobile
     without a scroll container. Title line (name · context), a status pill
     pinned top-right, then a single subtext line carrying the numbers.
     Sizing matches the existing scale exactly: title = .row-name/.sc-name
     (600/15px), subtext = .row-sub/.sc-meta (12px muted), pill = .conn-badge/
     .not-on-rumi (11px/600/3px 9px) — this is not a new visual language,
     just a different layout for the same tokens used everywhere else. */
  .status-list{ display:flex; flex-direction:column; }
  .status-card{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:14px 20px; border-bottom:1px solid var(--border); cursor:pointer;
    transition:background .15s ease;
  }
  .status-card:last-child{ border-bottom:0; }
  .status-card:hover{ background:var(--muted); }
  .status-card .sc-title{ font-size:15px; font-weight:600; color:var(--fg); }
  .status-card .sc-title .sep{ color:var(--muted-fg); font-weight:400; margin:0 2px; }
  .status-card .sc-title .markaz{ color:var(--muted-fg); font-weight:400; }
  .status-card .sc-sub{ margin-top:6px; font-size:12px; color:var(--muted-fg); line-height:1.6; }
  /* Stat badges for status-card subtext — reuses .teacher-badge's exact
     visual language (primary-tinted pill, bold primary text) instead of
     flat muted text, so the numbers stand out rather than blending in. */
  .sc-stats{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .sc-stats .stat-badge{
    font-size:12px; font-weight:600; color:var(--primary);
    background:color-mix(in srgb, var(--primary) 8%, transparent);
    padding:3px 10px; border-radius:999px; white-space:nowrap;
  }
  /* Second color for a distinct stat category (observations vs. schools/
     teachers). Orange (--accent) was ruled out — green/amber/red are already
     spoken for by the status pill sitting right next to these badges on the
     same card (Visited/No-visit), so reusing them here would look like a
     second status signal. --primary-light is a real, already-used token in
     this file (focus rings, links) — a lighter navy, not a new hue — so this
     stays a two-tone blue family instead of introducing an unestablished color. */
  .sc-stats .stat-badge.tint-light{
    color:var(--primary-light);
    background:color-mix(in srgb, var(--primary-light) 10%, transparent);
  }
  .status-card .sc-sub b{ color:var(--fg); font-weight:600; }
  .status-pill{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .status-pill.good{ background:color-mix(in srgb, var(--success) 14%, transparent); color:#1a7f42; }
  .status-pill.good .dot{ background:var(--success); }
  .status-pill.pending{ background:color-mix(in srgb, var(--warning) 12%, var(--muted)); color:#9a6400; }
  .status-pill.pending .dot{ background:var(--warning); }

  .avatar-sm{
    width:34px;height:34px;border-radius:50%;
    background:var(--muted); color:var(--primary);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700; flex:0 0 34px;
  }
  .name-cell{ display:flex; align-items:center; gap:12px; }

  /* Horizontally-scrolling strip instead of flex-wrap — a wrapped chip row
     turns into 2-3 stacked lines on mobile ("cluttered"); a single swipeable
     row stays one line at any width. Search lives outside this row (see
     .filter-search-row) so it's always visible, not scrolled off with chips. */
  .filter-row{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
    flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-row .chip{ flex:0 0 auto; }
  .filter-search-row{ display:flex; margin-bottom:16px; }
  .filter-search-row .search{ flex:1; max-width:none; }
  .clear-filters-chip{
    flex:0 0 auto; appearance:none; cursor:pointer; border:1px dashed var(--border);
    background:transparent; color:var(--muted-fg); font-size:13px; font-weight:600;
    padding:7px 14px; border-radius:999px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:4px;
  }
  .clear-filters-chip:hover{ background:var(--muted); color:var(--fg); }
  .chip{
    appearance:none; cursor:pointer; border:1px solid var(--border); background:var(--bg);
    color:var(--muted-fg); font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px;
    transition:all .15s ease;
  }
  .chip:hover{ background:var(--muted); }
  .chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .chip .n{ opacity:.7; margin-left:4px; }

  .search{
    flex:1; min-width:180px; max-width:280px;
    padding:8px 14px; border:1px solid var(--border); border-radius:8px;
    background:var(--bg); color:var(--fg); font-size:13px;
  }
  .search:focus{ outline:2px solid var(--primary-light); outline-offset:1px; }

  /* ---------- lesson plan list ---------- */
  .lp-list{ list-style:none; margin:0; padding:0; }
  .lp-list li{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 20px; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .lp-list li:last-child{ border-bottom:0; }
  .lp-title{ font-weight:600; }
  .lp-topic{ color:var(--muted-fg); font-size:12px; margin-top:2px; }
  .lp-count{
    font-size:11.5px; font-weight:600; color:var(--primary);
    background:color-mix(in srgb, var(--primary) 10%, transparent);
    padding:3px 10px; border-radius:999px; white-space:nowrap;
  }

  /* ---------- rich teacher profile (one example — Ghazala Riaz) ---------- */
  .mini-stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px;
  }
  @media (max-width:900px){ .mini-stats{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .mini-stats{ grid-template-columns:1fr; } }
  .mini-stat-card{

  // TM_FEEDBACK / the Feedback Log screen is intentionally removed for now —
  // there's no real product-feedback-log table in TaleemHub to ground it in,
  // and it needs a real shippable capture mechanism (e.g. off the WhatsApp

  // this prototype rather than as a fully fictional screen.

  var state = { screen:'attention', role:'aeo', schoolId:null, teacherId:null, teacherFilter:'all', teacherSearch:'', visibility:'individual', formId:null, teacherHistoryOrigin:null, stubLabel:null, deoMarkazFilter:null, markazFilter:'all', tmAeoMarkaz:null, tmActivityWindow:'all' };
  var root = document.getElementById('container');

    aeo:{ rolePill:'AEO — Rawalpindi', name:'Sadia Iqbal', roleLine:'Markaz: Adyala', initials:'SI' },
    tm:{ rolePill:'Training Manager — Rawalpindi', name:'Bilal Rasheed', roleLine:'4 markaz assigned', initials:'BR' },
    deo:{ rolePill:'DEO — Rawalpindi', name:'Aamir Latif', roleLine:'District: Rawalpindi', initials:'AL' },
    minister:{ rolePill:'Minister — Punjab', name:'Punjab School Education Dept.', roleLine:'Province: Punjab', initials:'PB' }
  };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function initials(name){ var p = name.split(' '); return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||''); }
  function needsSupport(v){ return v < NEEDS_SUPPORT_THRESHOLD; }
  function isNotOnRumi(t){ return t.status === 'not_on_rumi'; }
  function isAggregate(){ return state.visibility === 'aggregate'; }

  // "3 days ago" / "1 week ago" / "2 months ago" → approx days ago, so feeds
  // that claim to be "most recent first" can actually be sorted that way
  // instead of relying on insertion order.
  function parseRelativeDays(s){
    var m = /(\d+)\s*(day|week|month)/i.exec(s || '');
    if(!m) return 9999;
    var n = parseInt(m[1], 10);
    var unit = m[2].toLowerCase();
    if(unit === 'week') return n * 7;
    if(unit === 'month') return n * 30;
    return n;
  }

  function trendOf(arr){
    var last = arr[arr.length-1], prev = arr[arr.length-2];
    var pct = prev ? Math.round(((last-prev)/prev)*100) : 0;
    var dir = pct>0 ? 'up' : pct<0 ? 'down' : 'flat';
    return {dir:dir, pct:Math.abs(pct)};
  }

  // Net direction across the whole trend window (first vs. last), not just
  // the latest month-over-month step — catches a slow decline that flattens
  // right at the end (e.g. [18,17,16,16] reads "flat" MoM but is down overall).
  function netTrend(arr){
    var first = arr[0], last = arr[arr.length-1];
    var pct = first ? Math.round(((last-first)/first)*100) : 0;
    var dir = last<first ? 'down' : last>first ? 'up' : 'flat';
    return {dir:dir, pct:Math.abs(pct)};
  }
  function trendHtml(arr){
    var t = trendOf(arr);
    var arrow = t.dir==='up' ? '&#9650;' : t.dir==='down' ? '&#9660;' : '&#8212;';
    return '<span class="trend '+t.dir+'">'+arrow+' '+t.pct+'%</span>';
  }

  // A single legible trend mechanism (smooth line + light fill + one emphasized
  // endpoint) instead of stacking a bar, an arrow AND a disconnected bar-sparkline
  // on top of each other to say the same thing three times.
  function svgSpark(vals, w, h){
    w = w || 64; h = h || 22;
    var pad = Math.max(3, Math.round(h*0.14));
    var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
    if(min===max){ min-=1; max+=1; }
    var xs=function(i){ return vals.length===1 ? w/2 : (w-2*pad)*i/(vals.length-1)+pad; };
    var ys=function(v){ return h-pad-(h-2*pad)*(v-min)/(max-min); };
    var line = vals.map(function(v,i){ return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1); }).join(' ');
    var area = 'M'+xs(0).toFixed(1)+' '+(h-pad)+' '+vals.map(function(v,i){ return 'L'+xs(i).toFixed(1)+' '+ys(v).toFixed(1); }).join(' ')+' L'+xs(vals.length-1).toFixed(1)+' '+(h-pad)+' Z';
    var dir = trendOf(vals).dir;
    var col = dir==='up' ? '#22C55E' : dir==='down' ? '#DC2626' : '#6B7280';
    var lastX = xs(vals.length-1).toFixed(1), lastY = ys(vals[vals.length-1]).toFixed(1);
    var strokeW = h>40 ? 2.5 : 2;
    var dotR = h>40 ? 4 : 2.4;
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:block; flex:0 0 auto;">'
      + '<path d="'+area+'" fill="'+col+'" fill-opacity="0.14" stroke="none"/>'
      + '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="'+strokeW+'" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<circle cx="'+lastX+'" cy="'+lastY+'" r="'+dotR+'" fill="'+col+'"/>'
      + '</svg>';
  }

  function allTeachersFlat(){
    var rows = [];
    Object.keys(TEACHERS).forEach(function(sid){
      var school = SCHOOLS.find(function(s){return s.id===sid;});
      TEACHERS[sid].forEach(function(t){
        rows.push({ tid:t.id, sid:sid, schoolName:school.name, name:t.name, subject:t.subject, daysSince:t.daysSince, dcScore:t.dcScore, status:t.status||'active' });
      });
    });
    return rows;
  }

  // STANDING RULE for every card in this file: a given number is stated in
  // exactly ONE place per card. Severity/urgency is shown through color or
  // position, never a repeated numeral (e.g. an icon badge restating the count
  // already in the title). Encoding the same fact through a different channel
  // — a bar's fill width, a sparkline's shape — is fine; printing the same
  // digits twice is not.
  function severityOf(count){ return count>=5 ? 'high' : count>=2 ? 'medium' : 'low'; }

  function computeAttention(){
    var flags = [];
    var all = allTeachersFlat();
    var stale = all.filter(function(t){ return t.daysSince >= STALE_DAYS; });
    if(stale.length){
      flags.push({
        count: stale.length,
        icon:'&#8987;', title: stale.length+' teacher'+(stale.length===1?'':'s')+" haven't had a Digital Coach session in "+STALE_DAYS+'+ days',
        desc:'These teachers have gone quiet — worth a check-in before the gap widens.',
        action:{ screen:'teachers', filterKey:'stale' }
      });
    }
    // net direction over the whole window, not just the latest month — a slow
    // decline that flattens right at the end (e.g. 18→17→16→16) still counts.
    var dropping = SCHOOLS.filter(function(s){ return netTrend(s.lpTrend).dir==='down'; });
    if(dropping.length){
      flags.push({
        count: dropping.length,
        icon:'&#128200;', title: 'Lesson plan activity has dropped this quarter at '+dropping.length+' school'+(dropping.length===1?'':'s'),
        desc:'Comparing this month’s LP generation count against the start of the trend window — could mean connectivity issues, or teachers falling out of the habit.',
        action:{ screen:'schools' }
      });
    }
    var supportCount = all.filter(function(t){ return needsSupport(t.dcScore); }).length;
    if(supportCount){
      flags.push({
        count: supportCount,
        icon:'&#128204;', title: supportCount+' teacher'+(supportCount===1?'':'s')+' flagged as needing support',
        desc:'Based on recent Digital Coach sessions.',
        action:{ screen:'teachers', filterKey:'needs-support' }
      });
    }
    var notOnRumi = all.filter(function(t){ return isNotOnRumi(t); });
    if(notOnRumi.length){
      flags.push({
        count: notOnRumi.length,
        icon:'&#127793;', title: notOnRumi.length+' teacher'+(notOnRumi.length===1?'':'s')+" on your roster aren't yet on Rumi",
        desc:'On the school roster but never registered — worth a nudge before they fall out of reach entirely.',
        action:{ screen:'teachers', filterKey:'not-on-rumi' }
      });
    }
    // Biggest problem first — not insertion order.
    flags.sort(function(a,b){ return b.count - a.count; });
    return flags;
  }

  // "At a glance" tiles + the growth-area insight line for My Patch — numbers
  // to anchor the flags in, rather than opening straight on a problem list.
  function computePatchStats(){
    var all = allTeachersFlat();
    var dueIds = {};
    all.forEach(function(t){
      if(isNotOnRumi(t) || needsSupport(t.dcScore) || t.daysSince >= STALE_DAYS) dueIds[t.tid] = true;
    });
    var due = Object.keys(dueIds).length;

    var areaCounts = {};
    MY_FORMS.forEach(function(f){
      areaCounts[f.focusArea.title] = (areaCounts[f.focusArea.title] || 0) + 1;
    });
    var topArea = null, topCount = 0;
    Object.keys(areaCounts).forEach(function(k){
      if(areaCounts[k] > topCount){ topArea = k; topCount = areaCounts[k]; }
    });

    // Markaz-wide LP + DC aggregates: average each school's trend array
    // position-wise, so the tile's arrow reflects the whole patch, not one school.
    function averageTrend(key){
      var months = SCHOOLS[0][key].length;
      var out = [];
      for(var i=0;i<months;i++){
        var sum = 0;
        SCHOOLS.forEach(function(s){ sum += s[key][i]; });
        out.push(Math.round(sum / SCHOOLS.length));
      }
      return out;
    }
    var lpTrendAvg = averageTrend('lpTrend');
    var dcTrendAvg = averageTrend('dcTrend');
    var lpTotal = SCHOOLS.reduce(function(a,s){ return a+s.lpCount; },0);
    var dcAvg = Math.round(SCHOOLS.reduce(function(a,s){ return a+s.dcScore; },0) / SCHOOLS.length);

    var teachersOnRumi = all.filter(function(t){ return !isNotOnRumi(t); }).length;
    var debriefsPending = MY_FORMS.filter(function(f){ return f.debriefStatus==='pending'; }).length;

    return {
      schools: SCHOOLS.length,
      teachers: all.length,
      teachersOnRumi: teachersOnRumi,
      observedThisMonth: MY_FORMS.length,
      debriefsPending: debriefsPending,
      lpTotal: lpTotal,
      lpTrend: lpTrendAvg,
      dcAvg: dcAvg,
      dcTrend: dcTrendAvg,
      due: due,
      topArea: topArea,
      topAreaCount: topCount
    };
  }

  function crumbs(){
    var parts = [];
    if(state.screen==='attention'){ parts = [{label:'My Patch'}]; }
    else if(state.screen==='schools'){ parts = [{label:'Schools'}]; }
    else if(state.screen==='school-detail'){
      var school = SCHOOLS.find(function(s){return s.id===state.schoolId;});
      parts = [{label:'Schools', screen:'schools'}, {label: school ? school.name : 'School'}];
    }
    else if(state.screen==='teachers'){ parts = [{label:'Teachers'}]; }
    else if(state.screen==='teacher-history'){
      var t = allTeachersFlat().find(function(x){return x.tid===state.teacherId;});
      var origin = state.teacherHistoryOrigin;
      if(origin && origin.screen==='school-detail'){
        var originSchool = SCHOOLS.find(function(s){return s.id===origin.schoolId;});
        parts = [{label:'Schools', screen:'schools'}, {label: originSchool ? originSchool.name : 'School', screen:'school-detail'}, {label: t ? t.name : 'Report history'}];
      } else if(origin && origin.screen==='attention'){
        parts = [{label:'My Patch', screen:'attention'}, {label: t ? t.name : 'Report history'}];
      } else {
        parts = [{label:'Teachers', screen:'teachers'}, {label: t ? t.name : 'Report history'}];

    }
    else if(state.screen==='markaz-history'){ parts = [{label:'My Patch', screen:'attention'}, {label:'Markaz report history'}]; }
    else if(state.screen==='my-forms'){ parts = [{label:'My HOTS forms'}]; }
    else if(state.screen==='form-detail'){
      var f = MY_FORMS.find(function(x){return x.id===state.formId;});
      parts = [{label:'My HOTS forms', screen:'my-forms'}, {label: f ? (f.teacher+' · '+f.date) : 'Form'}];
    }
    else if(state.screen==='tm-region'){ parts = [{label:'My Patch'}]; }
    else if(state.screen==='tm-aeos'){ parts = [{label:'AEOs'}]; }
    else if(state.screen==='tm-aeo-detail'){
      var tmAeo = TM_PROFILE.assignedAeos.find(function(x){ return x.markaz===state.tmAeoMarkaz; });
      parts = [{label:'AEOs', screen:'tm-aeos'}, {label: tmAeo ? tmAeo.name : (state.tmAeoMarkaz || 'AEO')}];
    }
    else if(state.screen==='tm-coobs'){ parts = [{label:'Co-Observations'}]; }
    else if(state.screen==='deo-district'){ parts = [{label:'My District'}]; }
    else if(state.screen==='deo-markaz-detail'){
      var mdef = DEO_MARKAZ_FILTERS[state.deoMarkazFilter];
      parts = [{label:'My District', screen:'deo-district'}, {label: mdef ? mdef.label : 'Markaz detail'}];
    }
    else if(state.screen==='minister-overview'){ parts = [{label:'Punjab Overview'}]; }
    else if(state.screen==='stub-detail'){
      parts = [{label: state.role==='minister' ? 'Punjab Overview' : 'My District', screen: state.role==='minister' ? 'minister-overview' : 'deo-district'}, {label: state.stubLabel || 'Detail'}];
    }

    // Drilling into an AEO's own screens from a higher role — prepend the
    // rollup screen the AEO belongs to, so "back" reads correctly instead of
    // dropping straight to the AEO's own top-level crumb.
    var aeoScreens = ['attention','schools','school-detail','teachers','teacher-history','markaz-history','my-forms','form-detail'];
    if(aeoScreens.indexOf(state.screen)!==-1){
      if(state.role==='tm') parts.unshift({label:'AEOs', screen:'tm-aeos'});
      else if(state.role==='deo') parts.unshift({label:'My District', screen:'deo-district'});
      else if(state.role==='minister') parts.unshift({label:'Punjab Overview', screen:'minister-overview'}, {label:'My District', screen:'deo-district'});
    }
    if(state.screen==='deo-district' && state.role==='minister'){
      parts.unshift({label:'Punjab Overview', screen:'minister-overview'});
    }

    // A single-part crumb just repeats the page's own H1 — skip it entirely
    // rather than show a redundant "My Patch" above "My Patch".
    if(parts.length<=1) return '';

    var html = '<div class="crumbs">';
    parts.forEach(function(p, i){
      if(i>0) html += '<span class="sep">/</span>';
      if(i===parts.length-1){ html += '<span class="current">'+esc(p.label)+'</span>'; }
      else{ html += '<button data-goto="'+p.screen+'">'+esc(p.label)+'</button>'; }
    });
    html += '</div>';
    return html;
  }

  // Shared "needs attention" card list — same visual language (severity-colored
  // icon, title, desc, one optional action button) at any altitude: teachers
  // for an AEO, markaz for a DEO. Same philosophy, one level up, per design.
  function renderFlagCards(flags){
    var html = '<div class="card">';
    if(flags.length===0){
      html += '<div class="attn-empty"><div class="big">&#10003;</div>Nothing needs attention right now.</div>';
    } else {
      flags.forEach(function(f){
        var sev = severityOf(f.count);
        html += '<div class="attn-card"><div class="icon sev-'+sev+'">'+f.icon+'</div><div class="body">'
          + '<div class="title">'+f.title+'</div>'
          + '<div class="desc">'+f.desc+'</div>';
        if(f.action){
          var attr = f.action.markazFilterKey ? ' data-goto-deo-markaz="'+f.action.markazFilterKey+'"'
            : f.action.filterKey ? ' data-goto-filtered-teachers="'+f.action.filterKey+'"'
            : ' data-goto="'+f.action.screen+'"';
          html += '<button class="btn btn-ghost btn-sm" style="margin-top:10px;"'+attr+'>View details</button>';
        }
        html += '</div></div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderAttention(){
    var flags = computeAttention();
    var stats = computePatchStats();
    var html = '';
    html += crumbs();
    html += '<div class="page-head"><div>'
          +   '<h1>My Patch</h1>'
          +   '<p>Adyala markaz, at a glance — what actually needs your time this week, and where a little support would help most.</p>'
          + '</div></div>';

    html += '<div class="stats k4">'
      + '<div class="stat-card accent-primary"><div class="label">Schools</div><div class="value">'+stats.schools+'</div><div class="sub">in your roster</div></div>'
      + '<div class="stat-card accent-primary"><div class="label">Teachers</div><div class="value">'+stats.teachers+'</div><div class="sub">across all schools</div></div>'
      + '<div class="stat-card accent-primary"><div class="label">On Rumi</div><div class="value">'+stats.teachersOnRumi+'/'+stats.teachers+'</div><div class="sub">teachers active on Rumi</div></div>'
      + '<div class="stat-card accent-primary"><div class="label">Lesson plans</div><div class="value">'+stats.lpTotal+' '+trendHtml(stats.lpTrend)+'</div><div class="sub">generated this month, markaz-wide</div></div>'
      + '<div class="stat-card accent-primary"><div class="label">Digital Coach</div><div class="value">'+stats.dcAvg+'% '+trendHtml(stats.dcTrend)+'</div><div class="sub">avg. engagement across schools</div></div>'
      + '<div class="stat-card accent-primary"><div class="label">HOTS observations</div><div class="value">'+stats.observedThisMonth+'</div><div class="sub">submitted this term</div></div>'
      + '<div class="stat-card accent-warning"><div class="label">Debriefs pending</div><div class="value">'+stats.debriefsPending+'</div><div class="sub">still to hold with teachers</div></div>'
      + '<div class="stat-card accent-warning clickable" data-goto-filtered-teachers="due"><div class="label">Due for a visit</div><div class="value">'+stats.due+'</div><div class="sub">needs support, quiet 30+ days, or not yet on Rumi</div></div>'
      + '</div>';

    if(stats.topArea){
      html += '<div class="insight-card"><div class="ic">&#128161;</div><div class="body">'
        + '<div class="eyebrow">Insight</div>'
        + '<h3>Where to focus your next debriefs</h3>'
        + '<p>Across your <b>'+stats.observedThisMonth+' HOTS observations</b> this term, the most common growth area is <b>'+esc(stats.topArea)+'</b> ('+stats.topAreaCount+' of '+stats.observedThisMonth+'). Focusing your next visits here will move the most classrooms.</p>'
        + '</div></div>';
    }

    html += renderFlagCards(flags);

    html += '<div class="section" style="margin-top:32px;"><div class="section-head"><h2>Recent activity — markaz</h2><a class="section-link" data-goto="markaz-history">View all &rarr;</a></div>'
      + '<div style="font-size:13px; color:var(--muted-fg); margin:-8px 0 12px;">Latest 6 across all schools</div>';
    html += renderHistoryList(markazHistoryRows().slice(0,6), false);
    html += '</div>';

    root.innerHTML = html;
  }

  // coveragePct = visitsThisTerm / (schools*2) * 100 — real cadence is 2
  // visits per school per month (confirmed), so a markaz's full monthly
  // target is schools*2 visits. Computed here for every AEO row (not
  // hand-set in DEO_DISTRICT) so it can never drift out of sync with
  // visitsThisTerm.
  function deoAeoRows(){
    var patchStats = computePatchStats();
    return DEO_DISTRICT.aeos.map(function(a){
      var row = a;
      if(a.id==='aeo-adyala'){
        // Visits/activity/trend derived for real from Sadia's actual HOTS
        // submissions, rather than hardcoded like the stub AEOs — same
        // fields, real source.
        var visitsThisTerm = MY_FORMS.length;
        var lastActivityDays = Math.min.apply(null, MY_FORMS.map(function(f){ return parseRelativeDays(f.date); }));
        var connectivityIssueSchools = SCHOOLS.filter(function(s){ return s.connectivity!=='Good'; }).length;
        row = {id:a.id, name:a.name, markaz:a.markaz, drillable:a.drillable, schools:a.schools, teachers:a.teachers,
          dcAvg:patchStats.dcAvg, lpTotal:patchStats.lpTotal, due:patchStats.due,
          visitsThisTerm:visitsThisTerm, lastActivityDays:lastActivityDays, dcTrend:patchStats.dcTrend, connectivityIssueSchools:connectivityIssueSchools};
      }
      row.coveragePct = Math.round(row.visitsThisTerm / (row.schools*2) * 100);
      return row;
    }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  }

  // District-altitude aggregates: coverage (the actual lever a DEO can pull),
  // range/variance across markaz (not just the average), not a bigger version
  // of the AEO's own school/teacher counts.
  function computeDeoDistrictStats(){
    var aeos = deoAeoRows();
    var districtDcAvg = Math.round(aeos.reduce(function(a,x){return a+x.dcAvg;},0) / aeos.length);
    var coverageAvg = Math.round(aeos.reduce(function(a,x){return a+x.coveragePct;},0) / aeos.length);
    var months = aeos[0].dcTrend.length;
    var dcTrendAvg = [];
    for(var i=0;i<months;i++){
      var sum = 0;
      aeos.forEach(function(a){ sum += a.dcTrend[i]; });
      dcTrendAvg.push(Math.round(sum/aeos.length));
    }
    var dcAvgs = aeos.map(function(a){return a.dcAvg;});
    var range = { low: Math.min.apply(null, dcAvgs), high: Math.max.apply(null, dcAvgs) };
    var aeosNeedingSupport = aeos.filter(function(a){ return a.coveragePct < 60; }).length;
    var visitsThisTerm = aeos.reduce(function(a,x){ return a+x.visitsThisTerm; }, 0);
    return { aeos:aeos, districtDcAvg:districtDcAvg, dcTrend:dcTrendAvg, coverageAvg:coverageAvg, range:range, aeosNeedingSupport:aeosNeedingSupport, visitsThisTerm:visitsThisTerm };
  }

  function computeDeoAttention(){
    var aeos = deoAeoRows();
    var flags = [];
    var declining = aeos.filter(function(a){ return netTrend(a.dcTrend).dir==='down'; });
    if(declining.length){
      flags.push({
        count: declining.length,
        icon:'&#128201;', title: declining.length+' markaz'+(declining.length===1?'':'s')+' show declining coaching trends this term',
        desc:'Comparing each markaz’s DC trend against the start of the window — worth understanding whether it’s a staffing gap, a workload issue, or something else before it compounds.',
        action:{ markazFilterKey:'declining' }
      });
    }
    var lowCoverage = aeos.filter(function(a){ return a.coveragePct < 60; });

        count: lowCoverage.length,

        action:{ markazFilterKey:'coverage' }
      });
    }
    var affectedAeos = aeos.filter(function(a){ return a.connectivityIssueSchools > 0; });
    var affectedSchools = aeos.reduce(function(a,x){return a+x.connectivityIssueSchools;},0);
    if(affectedAeos.length>=2){
      flags.push({
        count: affectedAeos.length,
        icon:'&#128246;', title: 'Connectivity issues concentrated in '+affectedAeos.length+' of '+aeos.length+' markaz',
        desc: affectedSchools+' school'+(affectedSchools===1?'':'s')+' affected across those markaz — a resourcing/infrastructure question, not something any one AEO can fix alone.',
        action:{ markazFilterKey:'connectivity' }
      });
    }
    flags.sort(function(a,b){ return b.count - a.count; });
    return flags;

  function parseIsoDaysAgo(dateStr){
    var d = new Date(dateStr+'T00:00:00Z');
    var refNow = new Date('2026-05-25T00:00:00Z'); // fixed "today" so this stays stable without Date.now()
    return Math.round((refNow - d) / 86400000);
  }

  function tmVisitedMarkazSet(){
    var set = {};
    TM_VISITS.forEach(function(v){ set[v.markaz] = (set[v.markaz]||0) + 1; });

  function computeTmAttention(){

        action:{ screen:'tm-aeos' }

    return flags;
  }

  // ---- Rich teacher profile — built for ONE teacher only (Ghazala Riaz,
  // GPS Hayal, TEACHERS.s10[0].richProfile===true) as a full example of what
  // this screen could be everywhere; every other teacher keeps the plain
  // history list above unchanged.
  function trendBand(points){
    var avg = points.reduce(function(a,p){return a+p.value;},0) / points.length;
    if(avg>=70) return {name:'high', color:'#22C55E'};
    if(avg>=45) return {name:'mid', color:'#F59E0B'};
    return {name:'low', color:'#E86835'}; // orange, never red — non-punitive palette
  }

  // Qualitative trend line: shape + one overall color are the entire signal.
  // Deliberately no y-axis numbers and no value labels on the line itself —
  // only date labels beneath it.
  function trendVisualChart(points){
    var w=520, h=120, padX=16, padY=16, padBottom=28;
    var vals = points.map(function(p){return p.value;});
    var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
    if(min===max){ min-=1; max+=1; }
    var innerH = h-padY-padBottom;
    var xs=function(i){ return points.length===1 ? w/2 : (w-2*padX)*i/(points.length-1)+padX; };
    var ys=function(v){ return padY + innerH*(1-(v-min)/(max-min)); };
    var line = points.map(function(p,i){ return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.value).toFixed(1); }).join(' ');
    var area = 'M'+xs(0).toFixed(1)+' '+(h-padBottom)+' '+points.map(function(p,i){ return 'L'+xs(i).toFixed(1)+' '+ys(p.value).toFixed(1); }).join(' ')+' L'+xs(points.length-1).toFixed(1)+' '+(h-padBottom)+' Z';
    var band = trendBand(points);
    var labels = points.map(function(p,i){ return '<text x="'+xs(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" class="trend-chart-label">'+esc(p.label)+'</text>'; }).join('');
    return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" style="display:block;">'
      + '<path d="'+area+'" fill="'+band.color+'" fill-opacity="0.12" stroke="none"/>'
      + '<path d="'+line+'" fill="none" stroke="'+band.color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
      + labels
      + '</svg>';
  }

          + '</div></div>';

    html += '<div class="stats">'
      + '<div class="stat-card accent-primary"><div class="label">Forms submitted</div><div class="value">'+forms.length+'</div><div class="sub">this term</div></div>'
      + '<div class="stat-card accent-warning"><div class="label">Debriefs pending</div><div class="value">'+pendingCount+'</div><div class="sub">still to hold with the teacher</div></div>'
      + '</div>';

    html += '<div class="card"><div class="table-scroll"><table class="roster"><thead><tr>'
      + '<th>Teacher</th><th>School</th><th>Submitted</th><th>Overall</th><th>Debrief</th><th></th>'
      + '</tr></thead><tbody>';
    forms.forEach(function(f){
      html += '<tr data-goto-form="'+f.id+'">'
        + '<td><div class="row-name">'+esc(f.teacher)+'</div></td>'
        + '<td>'+esc(f.school)+'</td>'
        + '<td>'+esc(f.date)+'</td>'
        + '<td><span class="hots-pct">'+f.overallPct+'%</span></td>'
        + '<td>'+debriefPill(f.debriefStatus)+'</td>'
        + '<td><span class="chevron">&rsaquo;</span></td>'
        + '</tr>';
    });
    html += '</tbody></table></div></div>';

    html += '<div class="proto-note"><b>Prototype note:</b> this is the gap you flagged — right now the portal has no view of an AEO’s own submitted HOTS forms. Data here mirrors <code>coaching_sessions</code> filtered to <code>observer_user_id</code> = you, <code>observation_type = \'leader_observation\'</code>.</div>';
    root.innerHTML = html;
  }

  function renderFormDetail(){
    var f = MY_FORMS.find(function(x){return x.id===state.formId;}) || MY_FORMS[0];
    var html = '';
    html += crumbs();
    html += '<div class="page-head"><div><h1>'+esc(f.teacher)+'</h1><p>'+esc(f.school)+' · HOTS observation · submitted '+esc(f.date)+'</p></div>'
      + '<div class="actions">'+debriefPill(f.debriefStatus)+'<button class="btn btn-ghost" data-goto="my-forms">&larr; All forms</button></div></div>';

    html += '<div class="stats" style="grid-template-columns:1fr;">'
      + '<div class="stat-card accent-primary"><div class="label">Overall score</div><div class="value">'+f.overallPct+'%</div><div class="sub">of 48 marks across 16 indicators, 5 areas</div></div>'
      + '</div>';

    html += '<div class="hots-summary-card">'+esc(f.summary)+'</div>';

    HOTS_AREAS.forEach(function(area){
      var areaMax = area.indicators.length*3;
      var areaScore = area.indicators.reduce(function(a,ind){ return a + (f.scores[ind.id]||0); },0);
      html += '<div class="hots-area"><div class="hots-area-head"><span>'+esc(area.title)+'</span><span class="area-score">'+areaScore+' / '+areaMax+'</span></div>';
      html += '<div class="card">';
      area.indicators.forEach(function(ind){
        var score = f.scores[ind.id];
        var pips = '';
        for(var p=1;p<=3;p++){ pips += '<span class="hots-pip'+(p<=score?' filled'+(score===0?' zero':''):'')+'"></span>'; }
        html += '<div class="hots-indicator"><div class="hots-ind-top">'
          + '<div class="hots-ind-name">'+esc(ind.name)+'</div>'
          + '<div class="hots-pips">'+pips+'</div>'
          + '</div>';
        if(f.evidence[ind.id]) html += '<div class="hots-ind-evidence"><b>Evidence:</b> '+esc(f.evidence[ind.id])+'</div>';
        if(f.improvement[ind.id]) html += '<div class="hots-ind-improve"><b>Suggested improvement:</b> '+esc(f.improvement[ind.id])+'</div>';
        html += '</div>';
      });
      html += '</div></div>';
    });

    html += '<div class="section-head" style="margin-top:8px;"><h2>Your debrief</h2><span class="hint">Private to you — the teacher never sees this</span></div>';
    html += renderObserverDebrief(f);

    html += '<div class="hots-focus-card"><h3>Focus area — '+esc(f.focusArea.title)+'</h3>'
      + '<p><b style="color:var(--fg);">Why:</b> '+esc(f.focusArea.why)+'</p>'
      + '<p><b style="color:var(--fg);">Try:</b> '+esc(f.focusArea.tryText)+'</p></div>';

    html += '<div class="proto-note"><b>Prototype note:</b> "Your debrief" mirrors <code>coaching_sessions.analysis_data.observer_debrief</code> — the officer-only "coach-the-coach" card (praise / wins / concern / try / value). Per product rule, this is for the AEO alone, distinct from what the teacher receives, and it never includes the internal rubric booleans used only for the A/B study.</div>';

    root.innerHTML = html;
  }

  function renderObserverDebrief(f){
    var d = f.observerDebrief;
    if(!d){
      var msg = f.debriefStatus==='pending'
        ? 'Debrief not yet held — this will appear once you record it in /observe.'
        : 'Debrief was skipped for this session.';
      return '<div class="debrief-empty">'+esc(msg)+'</div>';
    }
    var hasConcern = !!d.concern;
    var html = '<div class="debrief-card '+(hasConcern?'concern':'clean')+'">';
    if(d.praiseLine){
      html += '<div class="debrief-praise">“'+esc(d.praiseLine)+'”</div>';
    }
    if(d.wins && d.wins.length){
      html += '<div class="debrief-section"><div class="label">What went well in your debrief</div>';
      d.wins.forEach(function(w){
        html += '<div class="debrief-win"><span class="dot">&#8226;</span><div class="txt"><b>'+esc(w.behaviour)+'</b><span>'+esc(w.evidence)+'</span></div></div>';
      });
      html += '</div>';
    }
    if(hasConcern){
      html += '<div class="debrief-section"><div class="label">Worth a second look</div><div class="debrief-concern-box">'
        + '<p><b>What happened:</b> '+esc(d.concern.whatHappened)+'</p>'
        + '<p><b>Why it matters:</b> '+esc(d.concern.whyItMatters)+'</p>'
        + '<p><b>Instead:</b> '+esc(d.concern.instead)+'</p>'
        + '</div></div>';
    } else if(d.tryMove){
      html += '<div class="debrief-section"><div class="label">One thing to try next time</div>'
        + '<div class="debrief-win"><span class="dot" style="color:var(--primary-light);">&#8594;</span><div class="txt"><b>'+esc(d.tryMove.move)+'</b><span>'+esc(d.tryMove.evidence)+' — '+esc(d.tryMove.instead)+'</span></div></div></div>';
    }
    if(d.value){
      html += '<div class="debrief-value">'+esc(d.value)+'</div>';
    }
    html += '</div>';
    return html;
  }

  function updateNav(){
    // .nav-btn covers both the desktop top tabs and the mobile bottom tab bar —
    // they mirror the same nav, so both need the active state and badge count.
    // Nav buttons are also tagged data-role — only the buttons for the
    // currently-viewed role show at all (AEO tabs hidden while viewing as DEO, etc).
    document.querySelectorAll('.nav-btn').forEach(function(b){
      var forThisRole = !b.dataset.role || b.dataset.role===state.role;
      b.style.display = forThisRole ? '' : 'none';
      var isAttn = b.dataset.nav==='attention' && (state.screen==='attention' || state.screen==='markaz-history');
      var isSchoolsGroup = b.dataset.nav==='schools' && (state.screen==='schools' || state.screen==='school-detail');
      var isTeachersGroup = b.dataset.nav==='teachers' && (state.screen==='teachers' || state.screen==='teacher-history');
      var isFormsGroup = b.dataset.nav==='my-forms' && (state.screen==='my-forms' || state.screen==='form-detail');
      var isDeoGroup = b.dataset.nav==='deo-district' && state.screen==='deo-district';
      var isMinisterGroup = b.dataset.nav==='minister-overview' && state.screen==='minister-overview';
      var isTmAeosGroup = b.dataset.nav==='tm-aeos' && (state.screen==='tm-aeos' || state.screen==='tm-aeo-detail');
      var isTmActive = isTmAeosGroup || (b.dataset.nav===state.screen && (state.screen==='tm-region' || state.screen==='tm-coobs'));
      b.classList.toggle('active', isAttn || isSchoolsGroup || isTeachersGroup || isFormsGroup || isDeoGroup || isMinisterGroup || isTmActive);
    });
    var attnCount = computeAttention().length;
    document.querySelectorAll('.attn-count').forEach(function(el){ el.textContent = attnCount; });

    document.querySelectorAll('.role-switch-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.roleSwitch===state.role);
    });
    // The Aggregate/Individual toggle only means something at the AEO level —
    // it masks individual teacher identities, which higher roles never see anyway.
    var visToggle = document.querySelector('.visibility-toggle');
    if(visToggle) visToggle.style.display = state.role==='aeo' ? '' : 'none';
    document.getElementById('visAggBtn').classList.toggle('active', state.visibility==='aggregate');
    document.getElementById('visIndBtn').classList.toggle('active', state.visibility==='individual');

    var identity = ROLE_IDENTITY[state.role];
    document.getElementById('rolePill').textContent = identity.rolePill;
    document.getElementById('userName').textContent = identity.name;
    document.getElementById('userRoleLine').textContent = identity.roleLine;
    document.getElementById('userAvatar').textContent = identity.initials;
  }

  function render(){
    updateNav();
    root.classList.remove('fade-in');
    void root.offsetWidth;
    root.classList.add('fade-in');
    if(state.screen==='attention') renderAttention();
    else if(state.screen==='schools') renderSchools();
    else if(state.screen==='school-detail') renderSchoolDetail();
    else if(state.screen==='teachers') renderTeachers();
    else if(state.screen==='teacher-history') renderTeacherHistory();
    else if(state.screen==='markaz-history') renderMarkazHistory();
    else if(state.screen==='my-forms') renderMyForms();
    else if(state.screen==='form-detail') renderFormDetail();
    else if(state.screen==='tm-region') renderTmRegion();
    else if(state.screen==='tm-aeos') renderTmAeos();
    else if(state.screen==='tm-aeo-detail') renderTmAeoDetail();
    else if(state.screen==='tm-coobs') renderTmCoObs();
    else if(state.screen==='deo-district') renderDeoDistrict();
    else if(state.screen==='deo-markaz-detail') renderDeoMarkazDetail();
    else if(state.screen==='minister-overview') renderMinisterOverview();
    else if(state.screen==='stub-detail') renderStubDetail();
    window.scrollTo(0,0);
  }

  document.addEventListener('click', function(e){
    // Checked first because "Schedule session" buttons sit inside clickable
    // table rows (data-goto-history) — without this ordering, the ancestor
    // row's handler fires first and swallows the button entirely.
    var scheduleBtn = e.target.closest('[data-action="schedule"]');
    if(scheduleBtn){
      e.stopPropagation();
      alert('Prototype action: this would open a scheduling flow for '+scheduleBtn.dataset.tname+' — the current portal is read-only, so this closes that loop.');
      return;
    }
    var viewPdfBtn = e.target.closest('[data-action="view-pdf"]');
    if(viewPdfBtn){
      e.stopPropagation();
      alert('Prototype action: this would open the PDF for "'+viewPdfBtn.dataset.lpTitle+'" — useful for multi-grade lesson plans especially, since mono-grade already gets printouts.');
      return;
    }
    var visBtn = e.target.closest('[data-visibility]');
    if(visBtn){
      state.visibility = visBtn.dataset.visibility;
      render(); return;
    }
    var roleSwitchBtn = e.target.closest('[data-role-switch]');
    if(roleSwitchBtn){
      state.role = roleSwitchBtn.dataset.roleSwitch;
      state.screen = state.role==='aeo' ? 'attention' : state.role==='tm' ? 'tm-region' : state.role==='deo' ? 'deo-district' : 'minister-overview';
      render(); return;
    }
    var aeoDrillBtn = e.target.closest('[data-goto-aeo-drill]');
    if(aeoDrillBtn){
      state.screen = 'attention';
      render(); return;
    }
    var deoDistrictBtn = e.target.closest('[data-goto-deo-district]');
    if(deoDistrictBtn){
      state.screen = 'deo-district';
      render(); return;
    }
    var deoMarkazBtn = e.target.closest('[data-goto-deo-markaz]');
    if(deoMarkazBtn){
      state.deoMarkazFilter = deoMarkazBtn.dataset.gotoDeoMarkaz;
      state.screen = 'deo-markaz-detail';
      render(); return;
    }
    var tmAeoBtn = e.target.closest('[data-goto-tm-aeo]');
    if(tmAeoBtn){
      state.tmAeoMarkaz = tmAeoBtn.dataset.gotoTmAeo;
      state.screen = 'tm-aeo-detail';
      render(); return;
    }
    var tmActivityBtn = e.target.closest('[data-tm-activity-window]');
    if(tmActivityBtn){
      state.tmActivityWindow = tmActivityBtn.dataset.tmActivityWindow;
      render(); return;
    }
    var markazFilterBtn = e.target.closest('[data-markaz-filter]');
    if(markazFilterBtn){
      state.markazFilter = markazFilterBtn.dataset.markazFilter;
      render(); return;
    }
    var clearTeacherFiltersBtn = e.target.closest('[data-clear-teacher-filters]');
    if(clearTeacherFiltersBtn){
      state.teacherFilter = 'all';
      state.teacherSearch = '';
      state.markazFilter = 'all';
      render(); return;
    }
    var stubBtn = e.target.closest('[data-goto-stub]');
    if(stubBtn){
      state.stubLabel = stubBtn.dataset.gotoStub;
      state.screen = 'stub-detail';
      render(); return;
    }
    var navBtn = e.target.closest('.nav-btn[data-nav]');
    if(navBtn){
      state.screen = navBtn.dataset.nav;
      render(); return;
    }
    var gotoBtn = e.target.closest('[data-goto]');
    if(gotoBtn){
      state.screen = gotoBtn.dataset.goto;
      render(); return;
    }
    var schoolRow = e.target.closest('[data-goto-school]');
    if(schoolRow){
      state.schoolId = schoolRow.dataset.gotoSchool;
      state.screen = 'school-detail';
      render(); return;
    }
    var histBtn = e.target.closest('[data-goto-history]');
    if(histBtn){
      if(isAggregate()) return;
      // Remember where this drill-down started so "back" can return to the
      // school/list the AEO actually came from, not always the global list.
      state.teacherHistoryOrigin = { screen: state.screen, schoolId: state.schoolId };
      state.teacherId = histBtn.dataset.gotoHistory;
      state.screen = 'teacher-history';
      render(); return;
    }
    var formRow = e.target.closest('[data-goto-form]');
    if(formRow){
      state.formId = formRow.dataset.gotoForm;
      state.screen = 'form-detail';
      render(); return;
    }
    var filteredTeachersBtn = e.target.closest('[data-goto-filtered-teachers]');
    if(filteredTeachersBtn){
      var wantedFilter = filteredTeachersBtn.dataset.gotoFilteredTeachers;
      state.screen = 'teachers';
      state.teacherFilter = (wantedFilter && wantedFilter !== '1') ? wantedFilter : 'needs-support';
      render(); return;
    }
    var filterChip = e.target.closest('[data-filter]');
    if(filterChip){
      state.teacherFilter = filterChip.dataset.filter;
      renderTeachers();
      return;
    }
  });

  render();
})();
</script>
